<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A chatbot made entirely of if statements, compiled from C to WebAssembly.">
  <title>ElifGPT</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body class="is-empty">
  <main class="shell">
    <header class="masthead">
      <h1 class="title">ElifGPT</h1>
      <p class="subtitle">10,000,000 lines of if statements. Zero neural networks.</p>

      <div class="loading" id="loading" role="status">
        <div class="bar" id="bar"><div class="bar-fill" id="bar-fill"></div></div>
        <p class="loading-text" id="loading-text">loading 1,000,000 lines of elif...</p>
      </div>

      <div class="chips" id="chips" hidden></div>
    </header>

    <section class="log" id="log" aria-live="polite" aria-label="Conversation"></section>
  </main>

  <div class="dock" id="dock">
    <form class="composer" id="composer" autocomplete="off">
      <div class="field">
        <textarea id="input" rows="1" aria-label="Message ElifGPT" aria-describedby="tab-hint" enterkeyhint="send" disabled></textarea>
        <div class="ghost" id="ghost" aria-hidden="true"><span id="ghost-text"></span><kbd class="tab-key">tab</kbd></div>
        <span class="sr-only" id="tab-hint">Press Enter to send, Shift+Enter for a new line. When the box is empty, Tab fills in the suggested prompt.</span>
      </div>
      <button type="submit" class="send" id="send" aria-label="Send message" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
    <footer class="footer">
      <a href="https://github.com/Lijeythefox/ElifGPT/releases/latest">Download the full 10M-line version</a>
      <span aria-hidden="true">&middot;</span>
      <a href="https://github.com/Lijeythefox/ElifGPT">View source</a>
    </footer>
  </div>
</body>
</html>
